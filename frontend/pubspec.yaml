name: eventos_captura_fotos
description: "Aplicação Flutter Web para captura e upload automático de fotos com QR Code."
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Captura de imagens (compatível com web)
  image_picker: ^1.0.0
  
  # Requisições HTTP
  http: ^1.1.0
  
  # Gerenciamento de estado
  provider: ^6.0.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
